// Surge suavemente ao entrar na tela (fade + subida + desfoque)
function Reveal({ children, delay = 0, y = 36, className = '', as = 'div' }) {
  const M = motion[as];
  return (
    <M
      className={className}
      initial={{ opacity: 0, y, filter: 'blur(8px)' }}
      whileInView={{ opacity: 1, y: 0, filter: 'blur(0px)' }}
      viewport={{ once: true, margin: '-80px' }}
      transition={{ duration: 1, ease: EASE, delay }}
    >
      {children}
    </M>
  );
}

// Título revelado palavra por palavra. parts: ['texto', {em: 'itálico'}]
function SplitHeading({ parts, as = 'h2', className = '', emClass = 'text-clay', trigger, delay = 0 }) {
  const words = [];
  parts.forEach((p) => {
    const isEm = typeof p === 'object';
    (isEm ? p.em : p).split(' ').filter(Boolean).forEach((w) => words.push({ w, em: isEm }));
  });
  const M = motion[as];
  const container = { hidden: {}, show: { transition: { staggerChildren: 0.07, delayChildren: delay } } };
  const word = {
    hidden: { y: '110%', rotate: 4 },
    show: { y: '0%', rotate: 0, transition: { duration: 1.1, ease: EASE } },
  };
  const control = trigger === undefined
    ? { initial: 'hidden', whileInView: 'show', viewport: { once: true, margin: '-60px' } }
    : { initial: 'hidden', animate: trigger ? 'show' : 'hidden' };
  return (
    <M className={className} variants={container} {...control}>
      {words.map((x, i) => (
        <span key={i} className="inline-block overflow-hidden align-bottom pb-[0.14em] -mb-[0.14em]">
          <motion.span variants={word} className={`inline-block origin-bottom-left ${x.em ? `italic ${emClass}` : ''}`}>
            {x.w}
          </motion.span>
          {i < words.length - 1 && ' '}
        </span>
      ))}
    </M>
  );
}

// Botão "magnético": acompanha levemente o cursor
function Magnetic({ children, strength = 0.3, className = '' }) {
  const ref = useRef(null);
  const x = useSpring(0, { stiffness: 180, damping: 14, mass: 0.4 });
  const y = useSpring(0, { stiffness: 180, damping: 14, mass: 0.4 });
  const move = (e) => {
    const r = ref.current.getBoundingClientRect();
    x.set((e.clientX - (r.left + r.width / 2)) * strength);
    y.set((e.clientY - (r.top + r.height / 2)) * strength);
  };
  const leave = () => { x.set(0); y.set(0); };
  return (
    <motion.div ref={ref} onMouseMove={move} onMouseLeave={leave} style={{ x, y }} className={className}>
      {children}
    </motion.div>
  );
}

// Botão com preenchimento que "sobe" no hover
function Button({ href, children, variant = 'primary', className = '', target = '_blank', ...rest }) {
  const styles = {

  const fill = { primary: 'bg-claydeep', ghost: 'bg-cocoa', light: 'bg-sand' }[variant];
  const hoverText = variant === 'ghost' ? 'group-hover:text-paper' : '';
  return (
    <motion.a
      href={href}
      target={href?.startsWith('#') ? undefined : target}
      rel="noopener"
      whileTap={{ scale: 0.96 }}
      className={`group relative inline-flex items-center justify-center gap-2.5 overflow-hidden rounded-full px-7 py-4 text-[0.97rem] font-semibold ${styles} ${className}`}
      {...rest}
    >
      <span className={`absolute inset-0 translate-y-full rounded-full ${fill} transition-transform duration-500 ease-[cubic-bezier(.22,1,.36,1)] group-hover:translate-y-0`} />
      <span className={`relative z-10 flex items-center gap-2.5 transition-colors duration-500 ${hoverText}`}>{children}</span>
    </motion.a>
  );
}

// Contador animado
function Counter({ to, decimals = 0, prefix = '', suffix = '' }) {
  const ref = useRef(null);
  const inView = useInView(ref, { once: true });
  useEffect(() => {
    if (!inView) return;
    const c = animate(0, to, {
      duration: 2.2, ease: EASE,
      onUpdate: (v) => { if (ref.current) ref.current.textContent = prefix + v.toFixed(decimals).replace('.', ',') + suffix; },
    });
    return () => c.stop();
  }, [inView]);
  return <span ref={ref}>{prefix}0{suffix}</span>;
}

/* Infra: scroll suave, barra de progresso, brilho do cursor, intro   */

function useSmoothScroll(enabled) {
  useEffect(() => {
    if (!enabled || !window.Lenis) return;
    const lenis = new window.Lenis({ duration: 1.25, easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)) });
    window.__lenis = lenis;
    let id;
    const raf = (t) => { lenis.raf(t); id = requestAnimationFrame(raf); };
    id = requestAnimationFrame(raf);
    return () => { cancelAnimationFrame(id); lenis.destroy(); window.__lenis = null; };
  }, [enabled]);

  // Links internos (#secao) usam o scroll suave
  useEffect(() => {
    const onClick = (e) => {
      const a = e.target.closest('a[href^="#"]');
      if (!a) return;
      const id = a.getAttribute('href');
      const el = id === '#top' ? 0 : document.querySelector(id);
      if (el === null) return;
      e.preventDefault();
      if (window.__lenis) window.__lenis.scrollTo(el, { offset: -72, duration: 1.6 });
      else if (el === 0) window.scrollTo({ top: 0, behavior: 'smooth' });
      else el.scrollIntoView({ behavior: 'smooth' });
    };
    document.addEventListener('click', onClick);
    return () => document.removeEventListener('click', onClick);
  }, []);
}

function ScrollProgress() {
  const { scrollYProgress } = useScroll();
  const scaleX = useSpring(scrollYProgress, { stiffness: 120, damping: 30 });
  return <motion.div style={{ scaleX }} className="fixed inset-x-0 top-0 z-[70] h-[3px] origin-left bg-gradient-to-r from-sage via-clay to-claydeep" />;
}

function CursorGlow() {
  const [fine, setFine] = useState(false);
  const x = useSpring(-500, { stiffness: 60, damping: 20 });
  const y = useSpring(-500, { stiffness: 60, damping: 20 });
  useEffect(() => {
    const mq = window.matchMedia('(pointer: fine)');
    setFine(mq.matches);
    const move = (e) => { x.set(e.clientX); y.set(e.clientY); };
    window.addEventListener('mousemove', move);
    return () => window.removeEventListener('mousemove', move);
  }, []);
  if (!fine) return null;
  return (
    <motion.div
      aria-hidden
      style={{ x, y }}
      className="pointer-events-none fixed left-0 top-0 z-[65] -ml-[260px] -mt-[260px] h-[520px] w-[520px] rounded-full mix-blend-multiply"
    >
      <div className="h-full w-full rounded-full bg-[radial-gradient(circle,rgba(184,107,75,.13),transparent_62%)]" />
    </motion.div>
  );
}

const NAV = [['#sobre', 'Sobre'], ['#terapias', 'Terapias'], ['#resultados', 'Resultados'], ['#feedbacks', 'Feedbacks'], ['#duvidas', 'Dúvidas']];

function Header({ ready }) {
  const { scrollY } = useScroll();
  const [hidden, setHidden] = useState(false);
  const [scrolled, setScrolled] = useState(false);
  const [open, setOpen] = useState(false);

  useMotionValueEvent(scrollY, 'change', (v) => {
    const prev = scrollY.getPrevious() ?? 0;
    setHidden(v > prev && v > 240);
    setScrolled(v > 30);
  });

  useEffect(() => {
    if (window.__lenis) open ? window.__lenis.stop() : window.__lenis.start();
  }, [open]);

  return (
    <motion.header
      initial={{ y: -100, opacity: 0 }}
      animate={{ y: ready ? (hidden && !open ? '-110%' : 0) : -100, opacity: ready ? 1 : 0 }}
      transition={{ duration: 0.7, ease: EASE }}
      className={`fixed inset-x-0 top-0 z-50 transition-[background,box-shadow,padding] duration-500 ${scrolled || open ? 'bg-cream/85 py-3 shadow-[0_1px_0_rgba(90,58,42,.08)] backdrop-blur-xl' : 'py-5'}`}
    >
      <Container className="flex items-center justify-between gap-5">
        <Logo />
        <nav className="hidden items-center gap-8 text-[0.93rem] font-medium text-cocoa md:flex">
          {NAV.map(([href, label]) => (
            <a key={href} href={href} className="group relative py-1">
              {label}
              <span className="absolute -bottom-0.5 left-0 h-[1.5px] w-full origin-right scale-x-0 bg-clay transition-transform duration-500 ease-[cubic-bezier(.22,1,.36,1)] group-hover:origin-left group-hover:scale-x-100" />
            </a>
          ))}
        </nav>
        <div className="hidden md:block">
          <Magnetic><Button href={wa()} className="!px-5 !py-3 text-sm">Agendar sessão</Button></Magnetic>
        </div>
        <button onClick={() => setOpen(!open)} className="relative grid h-11 w-11 place-items-center text-cocoa md:hidden" aria-label="Menu">
          <motion.span animate={open ? { rotate: 45, y: 0 } : { rotate: 0, y: -4 }} className="absolute h-[1.8px] w-6 rounded bg-current" />
          <motion.span animate={open ? { rotate: -45, y: 0 } : { rotate: 0, y: 4 }} className="absolute h-[1.8px] w-6 rounded bg-current" />
        </button>
      </Container>

      <AnimatePresence>
        {open && (
          <motion.nav
            initial={{ height: 0, opacity: 0 }}
            animate={{ height: 'auto', opacity: 1 }}
            exit={{ height: 0, opacity: 0 }}
            transition={{ duration: 0.6, ease: EASE }}
            className="overflow-hidden md:hidden"
          >
            <motion.ul
              initial="h" animate="s" exit="h"
              variants={{ s: { transition: { staggerChildren: 0.06, delayChildren: 0.1 } }, h: {} }}
              className="flex flex-col gap-1 px-5 pb-6 pt-4"
            >
              {NAV.map(([href, label]) => (
                <motion.li key={href} variants={{ h: { opacity: 0, x: -20 }, s: { opacity: 1, x: 0, transition: { ease: EASE, duration: 0.6 } } }}>
                  <a href={href} onClick={() => setOpen(false)} className="block border-b border-cocoa/10 py-3 font-serif text-2xl text-cocoa">{label}</a>
                </motion.li>
              ))}
              <motion.li variants={{ h: { opacity: 0, y: 10 }, s: { opacity: 1, y: 0 } }} className="pt-4">
                <Button href={wa()} className="w-full"><WaIcon /> Agendar pelo WhatsApp</Button>
              </motion.li>
            </motion.ul>
          </motion.nav>
        )}
      </AnimatePresence>
    </motion.header>
  );
}

/* Faixa que reage à velocidade do scroll                              */
/* ------------------------------------------------------------------ */
const wrap = (min, max, v) => { const r = max - min; return ((((v - min) % r) + r) % r) + min; };

function VelocityMarquee({ items, baseVelocity = -2, className = '' }) {
  const reduce = useReduce();
  const baseX = useMotionValue(0);
  const { scrollY } = useScroll();
  const vel = useSpring(useVelocity(scrollY), { damping: 50, stiffness: 400 });
  const factor = useTransform(vel, [0, 1000], [0, 4], { clamp: false });
  const x = useTransform(baseX, (v) => `${wrap(-50, 0, v)}%`);
  const dir = useRef(1);
  useAnimationFrame((t, delta) => {
    if (reduce) return;
    let move = dir.current * baseVelocity * (delta / 1000);
    if (factor.get() < 0) dir.current = -1; else if (factor.get() > 0) dir.current = 1;
    move += dir.current * move * factor.get();
    baseX.set(baseX.get() + move);
  });
  const row = items.map((t, i) => (
    <span key={i} className="flex items-center gap-10 pr-10">
      {t}<span className="text-sm not-italic text-clay">✦</span>
    </span>
  ));
  return (
    <div className={`overflow-hidden whitespace-nowrap ${className}`}>
      <motion.div style={{ x }} className="inline-flex">
        <div className="flex">{row}</div><div className="flex">{row}</div>
      </motion.div>
    </div>
  );
}

function Marquee() {
  const a = ['Alívio de dores', 'Menos tensão muscular', 'Mais mobilidade', 'Melhora da circulação', 'Recuperação pós-treino', 'Bem-estar e qualidade de vida'];

  return (

      <VelocityMarquee items={b} baseVelocity={2} className="mt-2 text-[0.78rem] font-semibold uppercase tracking-[0.25em] text-sand/60" />
    </div>
  );
}

function ServiceCard({ tone, icon, title, text, items, msg, delay }) {

    const r = ref.current.getBoundingClientRect();

    ref.current.style.setProperty('--mx', `${px * 100}%`);

/* Resultados — comparador antes/depois (arraste)                      */
/* A imagem img/antes-depois.jpg (1440x1920) é uma montagem; cada      */
/* lado é recortado aqui por coordenadas, alinhando o tronco.          */
/* ------------------------------------------------------------------ */
const AD_SRC = 'img/antes-depois.jpg';
const AD_W = 1440, AD_H = 1920;
const CROP_ANTES = { x: 207, y: 238, s: 580 };
const CROP_DEPOIS = { x: 556, y: 1267, s: 650 };

function Crop({ crop, alt }) {
  return (
    <div className="absolute inset-0 overflow-hidden">
      <img
        src={AD_SRC}
        alt={alt}
        draggable="false"
        className="absolute max-w-none select-none"
        style={{
          width: `${(AD_W / crop.s) * 100}%`,
          left: `${(-crop.x / crop.s) * 100}%`,
          top: `${(-crop.y / crop.s) * 100}%`,
        }}
      />
    </div>
  );
}

function BeforeAfter() {
  const ref = useRef(null);
  const inView = useInView(ref, { once: true, margin: '-120px' });
  const pos = useMotionValue(50);
  const smooth = useSpring(pos, { stiffness: 260, damping: 32 });
  const clip = useTransform(smooth, (v) => `inset(0 ${100 - v}% 0 0)`);
  const left = useTransform(smooth, (v) => `${v}%`);
  const antesOp = useTransform(smooth, [8, 25], [0, 1]);
  const depoisOp = useTransform(smooth, [75, 92], [1, 0]);
  const [dragging, setDragging] = useState(false);
  const touched = useRef(false);

  // Demonstração automática ao entrar na tela (mostra que dá para arrastar)
  useEffect(() => {
    if (!inView) return;
    const seq = [[82, 0.9], [18, 1.1], [50, 0.9]];
    let cancelled = false;
    (async () => {
      await new Promise((r) => setTimeout(r, 500));
      for (const [to, d] of seq) {
        if (cancelled || touched.current) return;
        await animate(pos, to, { duration: d, ease: 'easeInOut' });
      }
    })();
    return () => { cancelled = true; };
  }, [inView]);

  const setFrom = (e) => {
    const r = ref.current.getBoundingClientRect();
    pos.set(Math.min(100, Math.max(0, ((e.clientX - r.left) / r.width) * 100)));
  };
  const down = (e) => {
    touched.current = true;
    pos.stop();
    setDragging(true);
    ref.current.setPointerCapture(e.pointerId);
    setFrom(e);
  };
  const move = (e) => { if (dragging) setFrom(e); };
  const up = () => setDragging(false);
  const key = (e) => {
    if (e.key === 'ArrowLeft') { touched.current = true; pos.set(Math.max(0, pos.get() - 5)); }
    if (e.key === 'ArrowRight') { touched.current = true; pos.set(Math.min(100, pos.get() + 5)); }
  };

  return (
    <div
      ref={ref}
      onPointerDown={down}
      onPointerMove={move}
      onPointerUp={up}
      onPointerCancel={up}
      onKeyDown={key}
      tabIndex={0}
      role="slider"
      aria-label="Comparar antes e depois"
      aria-valuemin={0}
      aria-valuemax={100}
      className="relative aspect-square w-full cursor-ew-resize touch-pan-y select-none overflow-hidden rounded-[28px] bg-sand shadow-soft outline-none focus-visible:ring-4 focus-visible:ring-clay/40"
    >
      <Crop crop={CROP_DEPOIS} alt="Depois: abdômen após a liberação miofascial" />
      <motion.div style={{ clipPath: clip }} className="absolute inset-0">
        <Crop crop={CROP_ANTES} alt="Antes: abdômen antes da liberação miofascial" />
      </motion.div>

      <motion.span style={{ opacity: antesOp }} className="absolute left-4 top-4 rounded-full bg-ink/60 px-3.5 py-1.5 text-[0.7rem] font-bold uppercase tracking-[0.18em] text-paper backdrop-blur">Antes</motion.span>
      <motion.span style={{ opacity: depoisOp }} className="absolute right-4 top-4 rounded-full bg-clay/90 px-3.5 py-1.5 text-[0.7rem] font-bold uppercase tracking-[0.18em] text-paper backdrop-blur">Depois</motion.span>

      {/* Divisória + alça */}
      <motion.div style={{ left }} className="pointer-events-none absolute inset-y-0 -ml-px w-[2px] bg-paper/90 shadow-[0_0_12px_rgba(0,0,0,.25)]">
        <motion.div
          animate={{ scale: dragging ? 1.15 : 1 }}
          className="absolute left-1/2 top-1/2 -ml-7 -mt-7 grid h-14 w-14 place-items-center rounded-full bg-paper text-cocoa shadow-soft"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="h-6 w-6">
            <path d="M9 6l-6 6 6 6M15 6l6 6-6 6" />
          </svg>
          {!dragging && (
            <motion.span
              className="absolute inset-0 rounded-full border-2 border-paper"
              animate={{ scale: [1, 1.5], opacity: [0.8, 0] }}
              transition={{ duration: 1.8, repeat: Infinity, ease: 'easeOut' }}
            />
          )}
        </motion.div>
      </motion.div>
    </div>
  );
}

          <Eyebrow>Dúvidas frequentes</Eyebrow>
          <SplitHeading parts={['Tudo o que você', { em: 'precisa saber' }]} className="mb-5 mt-4 font-serif text-[clamp(2rem,4.4vw,3.2rem)] font-normal leading-[1.1] text-cocoa" />
          <Reveal as="p" delay={0.15} className="text-[1.06rem] text-muted">Ficou alguma dúvida? Me chama no WhatsApp que eu te explico com calma.</Reveal>
        </div>
        <div className="grid gap-3.5">
          {FAQ.map(([q, a], k) => {
            const isOpen = open === k;
            return (
              <Reveal key={q} delay={k * 0.06}>
                <motion.div layout className={`overflow-hidden rounded-[20px] border border-cocoa/[.07] transition-[background,box-shadow] duration-500 ${isOpen ? 'bg-[#FFFDF9] shadow-[0_10px_30px_-20px_rgba(90,58,42,.4)]' : 'bg-paper'}`}>
                  <button onClick={() => setOpen(isOpen ? -1 : k)} className="flex w-full items-center justify-between gap-4 px-6 py-5 text-left text-[1.02rem] font-semibold text-cocoa" aria-expanded={isOpen}>
                    {q}
                    <motion.span animate={{ rotate: isOpen ? 45 : 0, backgroundColor: isOpen ? '#B86B4B' : '#EFE3D3', color: isOpen ? '#FFFCF8' : '#5A3A2A' }} transition={{ duration: 0.4, ease: EASE }} className="grid h-8 w-8 shrink-0 place-items-center rounded-full text-lg leading-none">+</motion.span>
                  </button>
                  <AnimatePresence initial={false}>
                    {isOpen && (
                      <motion.div
                        initial={{ height: 0, opacity: 0 }}
                        animate={{ height: 'auto', opacity: 1 }}
                        exit={{ height: 0, opacity: 0 }}
                        transition={{ duration: 0.55, ease: EASE }}
                      >
                        <p className="px-6 pb-6 text-muted">{a}</p>
                      </motion.div>
                    )}
                  </AnimatePresence>
                </motion.div>
              </Reveal>
            );
          })}
        </div>
      </Container>
    </section>
  );
}

/* ------------------------------------------------------------------ */
/* Chamada final — ondas como a sucção da ventosa                      */
/* ------------------------------------------------------------------ */
function FinalCta() {
  const ref = useRef(null);
  const { scrollYProgress } = useScroll({ target: ref, offset: ['start end', 'center center'] });
  const scale = useTransform(scrollYProgress, [0, 1], [0.9, 1]);
  const radius = useTransform(scrollYProgress, [0, 1], [80, 48]);
  return (
    <section ref={ref} className="pb-24 pt-6 md:pb-32">
      <Container>
        <motion.div
          style={{ scale, borderRadius: radius }}
          className="relative overflow-hidden bg-[radial-gradient(circle_at_20%_20%,#D08A69,#B86B4B_40%,#8F4C33)] px-6 py-20 text-center text-paper sm:px-10 sm:py-24"
        >
          <div className="pointer-events-none absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2">
            {[0, 1, 2, 3].map((k) => (
              <motion.span
                key={k}
                className="absolute left-1/2 top-1/2 -ml-[150px] -mt-[150px] h-[300px] w-[300px] rounded-full border border-white/25"
                animate={{ scale: [0.4, 2.6], opacity: [0.7, 0] }}
                transition={{ duration: 6, repeat: Infinity, delay: k * 1.5, ease: 'easeOut' }}
              />
            ))}
          </div>
          <SplitHeading
            parts={['Pronta(o) para sentir o corpo', { em: 'mais leve?' }]}
            emClass="text-[#FBE3D3]"
            className="relative mx-auto mb-5 max-w-[16ch] font-serif text-[clamp(2.2rem,5vw,3.8rem)] font-normal leading-[1.08] text-paper"
          />
          <Reveal as="p" delay={0.2} className="relative mx-auto mb-9 max-w-[52ch] text-[1.08rem] opacity-90">
            Agende sua sessão agora e dê ao seu corpo o cuidado que ele está pedindo.
          </Reveal>
          <Reveal delay={0.3} className="relative inline-block w-full sm:w-auto">
            <Magnetic strength={0.4}><Button href={wa()} variant="light" className="w-full sm:w-auto"><WaIcon /> Agendar minha sessão</Button></Magnetic>
          </Reveal>
        </motion.div>
      </Container>
    </section>
  );
}

/* ------------------------------------------------------------------ */
/* Rodapé + WhatsApp flutuante                                         */
/* ------------------------------------------------------------------ */
function Footer() {
  return (
    <footer className="bg-ink pb-8 pt-16 text-[0.92rem] text-[#CDBFB3]">
      <Container>
        <div className="grid gap-12 sm:grid-cols-2 lg:grid-cols-[1.4fr_1fr_1fr]">
          <div>
            <Logo light sub="Liberação Miofascial & Ventosaterapia" />
            <p className="mt-5 max-w-[36ch]">Cuidado, bem-estar e qualidade de vida. 🤎🌿</p>
            <div className="mt-6 flex gap-2.5">
              {[
                [INSTAGRAM, 'Instagram', <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" className="h-[18px] w-[18px]"><rect x="3" y="3" width="18" height="18" rx="5" /><circle cx="12" cy="12" r="4" /><circle cx="17.5" cy="6.5" r="1" fill="currentColor" /></svg>],
                [wa(), 'WhatsApp', <WaIcon className="h-[18px] w-[18px]" />],
              ].map(([href, label, icon]) => (
                <motion.a key={label} href={href} target="_blank" rel="noopener" aria-label={label} whileHover={{ y: -3 }}
                  className="grid h-11 w-11 place-items-center rounded-full border border-white/15 transition-colors hover:border-clay hover:bg-clay hover:text-paper">{icon}</motion.a>
              ))}
            </div>
          </div>
          <div>
            <h4 className="mb-4 font-serif text-lg font-normal text-paper">Navegação</h4>
            <ul className="grid gap-2.5">{NAV.map(([h, l]) => <li key={h}><a href={h} className="transition-colors hover:text-peach">{l}</a></li>)}</ul>
          </div>
          <div>
            <h4 className="mb-4 font-serif text-lg font-normal text-paper">Contato</h4>
            <ul className="grid gap-2.5">
              <li><a href={wa()} target="_blank" rel="noopener" className="transition-colors hover:text-peach">(47) 99720-5699</a></li>
              <li><a href={INSTAGRAM} target="_blank" rel="noopener" className="transition-colors hover:text-peach">@marinasilssamafra</a></li>
              {/* Preencha com a cidade / endereço de atendimento */}
              <li>Atendimento com hora marcada</li>
            </ul>
          </div>
        </div>
        <div className="mt-12 flex flex-wrap justify-between gap-4 border-t border-white/[.08] pt-6 text-[0.8rem] opacity-70">
          <span>© {new Date().getFullYear()} Mari Mafra. Todos os direitos reservados.</span>
          <span>As terapias não substituem acompanhamento médico.</span>
        </div>
      </Container>
    </footer>
  );
}

function WhatsFloat() {
  const { scrollY } = useScroll();
  const [show, setShow] = useState(false);
  useMotionValueEvent(scrollY, 'change', (v) => setShow(v > 500));
  return (
    <AnimatePresence>
      {show && (
        <motion.a
          href={wa()} target="_blank" rel="noopener" aria-label="Falar no WhatsApp"
          initial={{ scale: 0, rotate: -90 }} animate={{ scale: 1, rotate: 0 }} exit={{ scale: 0, rotate: 90 }}
          whileHover={{ scale: 1.1 }} whileTap={{ scale: 0.92 }}
          transition={{ type: 'spring', stiffness: 260, damping: 18 }}
          className="fixed bottom-5 right-5 z-[60] grid h-[60px] w-[60px] place-items-center rounded-full bg-[#25D366] text-white shadow-[0_12px_30px_-8px_rgba(37,211,102,.6)]"
        >
          <motion.span className="absolute inset-0 rounded-full bg-[#25D366]" animate={{ scale: [1, 1.6], opacity: [0.5, 0] }} transition={{ duration: 2.2, repeat: Infinity, ease: 'easeOut' }} />
          <WaIcon className="relative h-8 w-8" />
        </motion.a>
      )}
    </AnimatePresence>
  );
}

/* ------------------------------------------------------------------ */
/* App                                                                 */
/* ------------------------------------------------------------------ */
function App() {
  const reduce = useReduce();
  const [intro, setIntro] = useState(true);
  useSmoothScroll(!reduce);
  useEffect(() => {
    document.getElementById('boot')?.remove();
    const t = setTimeout(() => setIntro(false), reduce ? 0 : 1900);
    return () => clearTimeout(t);
  }, []);
  const ready = !intro;
  return (
    <MotionConfig reducedMotion={RESPECT_REDUCED_MOTION ? 'user' : 'never'}>
      <Intro show={intro} />
      <ScrollProgress />
      <CursorGlow />
      <Header ready={ready} />
      <main id="top">
        <Hero ready={ready} />
        <Marquee />
        <About />
        <Services />
        <Results />
        <Benefits />
        <Who />
        <Steps />
        <Feedbacks />
        <Faq />
        <FinalCta />
      </main>
      <Footer />
      <WhatsFloat />
    </MotionConfig>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
